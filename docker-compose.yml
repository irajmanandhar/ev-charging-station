# One command to run the whole platform:  docker compose up --build
#   Web app  -> http://localhost:3000
#   API      -> http://localhost:8000
x-api-env: &api-env
  APP_ENV: local
  APP_DEBUG: "true"
  APP_URL: http://localhost:8000
  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: 3306
  DB_DATABASE: ev_charge
  DB_USERNAME: ev
  DB_PASSWORD: secret
  CACHE_STORE: database
  FRONTEND_URL: http://localhost:3000
  MAIL_MAILER: log
  EXPOSE_OTP_IN_RESPONSE: "true"

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ev_charge
      MYSQL_USER: ev
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./backend
    environment:
      <<: *api-env
      RUN_MIGRATIONS: "true"
      SEED_DEMO_DATA: "true"
    depends_on:
      mysql:
        condition: service_healthy

  # Runs the every-minute sweep (no-shows, overrunning sessions).
  scheduler:
    build: ./backend
    environment: *api-env
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      - api

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8000:80"
    volumes:
      - ./backend/public:/var/www/public:ro
      - ./backend/docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - nginx

volumes:
  mysql-data:
