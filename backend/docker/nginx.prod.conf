server_tokens off;

server {
    listen 8080;
    server_name _;
    root /var/www/public;
    index index.php;
    client_max_body_size 4m;

    # Security headers for API responses come from Laravel's SecurityHeaders middleware.

    gzip on;
    gzip_types application/json text/csv text/plain;

    location / {
        try_files $uri /index.php?$query_string;
    }

    location ~ ^/index\.php$ {
        fastcgi_pass api:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_read_timeout 30s;
    }

    # no other PHP file is ever executed, and dotfiles stay private
    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
