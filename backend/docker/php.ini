expose_php = Off
memory_limit = 256M
upload_max_filesize = 4M
post_max_size = 4M
display_errors = Off
log_errors = On

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000
; production code never changes inside a running container
opcache.validate_timestamps = 0
