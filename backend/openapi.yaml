openapi: 3.1.0
info:
  title: Bijuli Charge API
  version: 1.0.0
  description: |
    EV charging station finder and booking API.

    **Envelope.** Every JSON response is `{ success, message, data }` on success, or
    `{ success: false, message, code, errors }` on failure. `code` is a stable machine-readable
    value (`validation_failed`, `slot_taken`, `too_many_requests`, ...). Business-rule failures
    also repeat their code in `errors.code`.

    **Auth.** `POST /login` returns a bearer token (expires after `SANCTUM_TOKEN_EXPIRATION_MINUTES`,
    default 7 days). Send it as `Authorization: Bearer <token>`.

    **Time.** Timestamps are ISO-8601 UTC. Availability and opening hours are in the station's time zone.

    **Pagination.** `GET /bookings` and `GET /sessions` return up to 100 items; add `page` (and optionally
    `per_page`, max 50) for a paginated response with a `meta` object.
servers:
  - url: http://localhost:8000/api
    description: Local development
security:
  - bearer: []

tags:
  - { name: Auth }
  - { name: Stations }
  - { name: Bookings }
  - { name: Charging }
  - { name: Payments }
  - { name: Operator }
  - { name: Admin }

paths:
  /config:
    get:
      tags: [Stations]
      summary: Public, non-secret settings for the web app
      security: []
      responses:
        "200": { $ref: "#/components/responses/Config" }

  # ---- Auth ------------------------------------------------------------------------------
  /register:
    post:
      tags: [Auth]
      summary: Start sign-up and email a 6-digit code
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password, password_confirmation]
              properties:
                name: { type: string, maxLength: 100 }
                email: { type: string, format: email }
                phone: { type: string, pattern: "^[0-9]{10}$" }
                password: { type: string, minLength: 8 }
                password_confirmation: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "422": { $ref: "#/components/responses/Invalid" }
        "429": { $ref: "#/components/responses/TooMany" }
  /verify-email-otp:
    post:
      tags: [Auth]
      summary: Verify the sign-up code, create the account and sign in
      description: A code is burned after 5 wrong guesses.
      security: []
      requestBody: { $ref: "#/components/requestBodies/EmailOtp" }
      responses:
        "201": { $ref: "#/components/responses/AuthToken" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Invalid" }
        "429": { $ref: "#/components/responses/TooMany" }
  /resend-otp:
    post:
      tags: [Auth]
      summary: Send a new sign-up code (same reply whether or not a sign-up is pending)
      security: []
      requestBody: { $ref: "#/components/requestBodies/EmailOnly" }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "429": { $ref: "#/components/responses/TooMany" }
  /login:
    post:
      tags: [Auth]
      summary: Sign in with email and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        "200": { $ref: "#/components/responses/AuthToken" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/TooMany" }
  /logout:
    post:
      tags: [Auth]
      summary: Revoke the current token
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "401": { $ref: "#/components/responses/Error" }
  /me:
    get:
      tags: [Auth]
      summary: The signed-in user
      responses:
        "200": { $ref: "#/components/responses/User" }
        "401": { $ref: "#/components/responses/Error" }
  /password/forgot:
    post:
      tags: [Auth]
      summary: Email a password-reset code (same reply for unknown emails)
      security: []
      requestBody: { $ref: "#/components/requestBodies/EmailOnly" }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "429": { $ref: "#/components/responses/TooMany" }
  /password/verify-otp:
    post:
      tags: [Auth]
      summary: Check a reset code without using it
      security: []
      requestBody: { $ref: "#/components/requestBodies/EmailOtp" }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "422": { $ref: "#/components/responses/Invalid" }
        "429": { $ref: "#/components/responses/TooMany" }
  /password/reset:
    post:
      tags: [Auth]
      summary: Set a new password with a reset code (signs out every device)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, otp, password, password_confirmation]
              properties:
                email: { type: string, format: email }
                otp: { type: string, minLength: 6, maxLength: 6 }
                password: { type: string, minLength: 8 }
                password_confirmation: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "422": { $ref: "#/components/responses/Invalid" }
        "429": { $ref: "#/components/responses/TooMany" }
  /auth/{provider}/redirect:
    get:
      tags: [Auth]
      summary: Start Google or Facebook sign-in
      description: "With `Accept: application/json` returns `{ url }`; otherwise redirects to the provider."
      security: []
      parameters: [{ $ref: "#/components/parameters/Provider" }]
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "302": { description: Redirect to the provider }
        "400": { $ref: "#/components/responses/Error" }
  /auth/{provider}/callback:
    get:
      tags: [Auth]
      summary: Provider callback
      description: |
        Redirects the browser to the web app with the token in the URL **fragment** (`/auth/social#token=...`).
        An existing password account is only linked when the provider vouches for the email (Google
        `email_verified`); otherwise `409`.
      security: []
      parameters: [{ $ref: "#/components/parameters/Provider" }]
      responses:
        "200": { $ref: "#/components/responses/AuthToken" }
        "302": { description: Redirect to the web app }
        "409": { $ref: "#/components/responses/Error" }

  # ---- Stations --------------------------------------------------------------------------
  /stations:
    get:
      tags: [Stations]
      summary: Station finder
      security: []
      parameters:
        - { name: lat, in: query, schema: { type: number, minimum: -90, maximum: 90 } }
        - { name: lng, in: query, schema: { type: number, minimum: -180, maximum: 180 } }
        - { name: radius_km, in: query, schema: { type: number, minimum: 1, maximum: 200, default: 25 } }
        - { name: connector, in: query, schema: { $ref: "#/components/schemas/Connector" } }
        - { name: min_power, in: query, schema: { type: number, minimum: 0 } }
        - { name: available_now, in: query, schema: { type: boolean } }
        - { name: q, in: query, schema: { type: string, maxLength: 80 } }
      responses:
        "200": { $ref: "#/components/responses/StationList" }
        "422": { $ref: "#/components/responses/Invalid" }
  /stations/{station}:
    get:
      tags: [Stations]
      summary: One station with live charger status
      security: []
      parameters: [{ $ref: "#/components/parameters/Station" }]
      responses:
        "200": { $ref: "#/components/responses/Station" }
        "404": { $ref: "#/components/responses/Error" }
  /chargers/{charger}/availability:
    get:
      tags: [Stations]
      summary: Slot grid for one day
      security: []
      parameters:
        - { $ref: "#/components/parameters/Charger" }
        - { name: date, in: query, description: Station-local date, schema: { type: string, format: date } }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "422": { $ref: "#/components/responses/Invalid" }
  /chargers/{charger}/quote:
    get:
      tags: [Stations]
      summary: Price estimate for a duration
      security: []
      parameters:
        - { $ref: "#/components/parameters/Charger" }
        - { name: minutes, in: query, required: true, schema: { type: integer, minimum: 1, maximum: 600 } }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "422": { $ref: "#/components/responses/Invalid" }

  # ---- Bookings --------------------------------------------------------------------------
  /bookings:
    get:
      tags: [Bookings]
      summary: My bookings
      parameters:
        - { name: scope, in: query, schema: { type: string, enum: [upcoming, past, all], default: all } }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/BookingStatus" } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        "200": { $ref: "#/components/responses/BookingList" }
        "401": { $ref: "#/components/responses/Error" }
    post:
      tags: [Bookings]
      summary: Reserve a charger
      description: |
        The charger row is locked for the transaction, so two drivers racing for a slot get exactly
        one `201`; the loser gets `409 slot_taken`. Other codes: `bad_duration`, `in_past`,
        `too_far_ahead`, `station_closed`, `station_unavailable`, `charger_unavailable`,
        `user_overlap`, `too_many_bookings`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [charger_id, starts_at, duration_minutes]
              properties:
                charger_id: { type: integer }
                starts_at: { type: string, format: date-time, description: Must sit on a 15-minute boundary }
                duration_minutes: { type: integer, minimum: 30, maximum: 240, multipleOf: 15 }
                vehicle: { type: string, maxLength: 80 }
      responses:
        "201": { $ref: "#/components/responses/Booking" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Invalid" }
        "429": { $ref: "#/components/responses/TooMany" }
  /bookings/{booking}:
    get:
      tags: [Bookings]
      summary: One booking (owner, the station's operator, or an admin)
      parameters: [{ $ref: "#/components/parameters/Booking" }]
      responses:
        "200": { $ref: "#/components/responses/Booking" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /bookings/{booking}/cancel:
    post:
      tags: [Bookings]
      summary: Cancel an upcoming booking (owner only)
      description: Cancelling inside the free-cancellation window keeps a fee (`cancellation_fee`). A paid booking is refunded minus the fee where the provider allows it.
      parameters: [{ $ref: "#/components/parameters/Booking" }]
      responses:
        "200": { $ref: "#/components/responses/Booking" }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /bookings/{booking}/check-in:
    post:
      tags: [Charging]
      summary: Check in at the charger and start charging (owner only)
      description: 'Codes: `too_early`, `too_late`, `charger_unavailable`, `charger_busy`, `reserved_before`, `not_startable`.'
      parameters: [{ $ref: "#/components/parameters/Booking" }]
      responses:
        "201": { $ref: "#/components/responses/Session" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /bookings/{booking}/pay:
    post:
      tags: [Payments]
      summary: Start paying a booking's estimated cost (sandbox gateways)
      description: Returns where to send the driver. eSewa also returns signed `form` fields to POST. `422 payments_disabled` when no gateway is configured.
      parameters: [{ $ref: "#/components/parameters/Booking" }]
      responses:
        "201": { $ref: "#/components/responses/PaymentStarted" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /payments/{payment}/confirm:
    post:
      tags: [Payments]
      summary: Confirm a payment after the provider redirect
      description: The provider is asked directly (amount included); the client's claim is never trusted. Idempotent.
      parameters:
        - { name: payment, in: path, required: true, schema: { type: integer } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                pidx: { type: string }
                data: { type: string }
                status: { type: string }
      responses:
        "200": { $ref: "#/components/responses/PaymentResult" }
        "403": { $ref: "#/components/responses/Error" }

  # ---- Charging --------------------------------------------------------------------------
  /chargers/{charger}/start:
    post:
      tags: [Charging]
      summary: Walk-up charging (book from now and start immediately)
      description: "Atomic: if starting fails, no booking is left behind."
      parameters: [{ $ref: "#/components/parameters/Charger" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [duration_minutes]
              properties:
                duration_minutes: { type: integer, minimum: 30, maximum: 240, multipleOf: 15 }
                vehicle: { type: string, maxLength: 80 }
      responses:
        "201": { $ref: "#/components/responses/Session" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Invalid" }
  /sessions:
    get:
      tags: [Charging]
      summary: My charging sessions
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [active, completed] } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        "200": { $ref: "#/components/responses/SessionList" }
  /sessions/{session}/stop:
    post:
      tags: [Charging]
      summary: Stop a session and meter it (driver, the station's operator, or an admin)
      parameters:
        - { name: session, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { $ref: "#/components/responses/Session" }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  # ---- Operator --------------------------------------------------------------------------
  /operator/metrics:
    get:
      tags: [Operator]
      summary: Usage and revenue metrics
      parameters:
        - { name: days, in: query, schema: { type: integer, enum: [7, 30, 90], default: 30 } }
        - { name: station_id, in: query, schema: { type: integer } }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "403": { $ref: "#/components/responses/Error" }
  /operator/bookings:
    get:
      tags: [Operator]
      summary: Bookings across the operator's stations for one local day
      parameters:
        - { name: station_id, in: query, schema: { type: integer } }
        - { name: date, in: query, schema: { type: string, format: date } }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/BookingStatus" } }
      responses:
        "200": { $ref: "#/components/responses/BookingList" }
        "403": { $ref: "#/components/responses/Error" }
  /operator/export/bookings:
    get:
      tags: [Operator]
      summary: Download bookings as CSV (max 93 days)
      description: Spreadsheet formulas in user-supplied text are neutralised.
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
        - { name: station_id, in: query, schema: { type: integer } }
      responses:
        "200":
          description: CSV file
          content:
            text/csv:
              schema: { type: string }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Invalid" }
  /operator/stations:
    get:
      tags: [Operator]
      summary: My stations (admins see all)
      responses:
        "200": { $ref: "#/components/responses/StationList" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      tags: [Operator]
      summary: Create a station
      requestBody: { $ref: "#/components/requestBodies/Station" }
      responses:
        "201": { $ref: "#/components/responses/Station" }
        "422": { $ref: "#/components/responses/Invalid" }
  /operator/stations/{station}:
    parameters: [{ $ref: "#/components/parameters/Station" }]
    get:
      tags: [Operator]
      summary: One of my stations
      responses:
        "200": { $ref: "#/components/responses/Station" }
        "403": { $ref: "#/components/responses/Error" }
    patch:
      tags: [Operator]
      summary: Update a station
      description: A status an admin imposed (`status_locked`) cannot be changed by the operator; other fields still save.
      requestBody: { $ref: "#/components/requestBodies/Station" }
      responses:
        "200": { $ref: "#/components/responses/Station" }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Invalid" }
    delete:
      tags: [Operator]
      summary: Delete a station that has no booking history
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /operator/stations/{station}/chargers:
    post:
      tags: [Operator]
      summary: Add a charger
      parameters: [{ $ref: "#/components/parameters/Station" }]
      requestBody: { $ref: "#/components/requestBodies/Charger" }
      responses:
        "201": { $ref: "#/components/responses/Ok" }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Invalid" }
  /operator/chargers/{charger}:
    parameters: [{ $ref: "#/components/parameters/Charger" }]
    patch:
      tags: [Operator]
      summary: Update a charger
      requestBody: { $ref: "#/components/requestBodies/Charger" }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Invalid" }
    delete:
      tags: [Operator]
      summary: Delete a charger that has no booking history
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  # ---- Admin -----------------------------------------------------------------------------
  /admin/overview:
    get:
      tags: [Admin]
      summary: Network-wide counts, metrics and recent admin activity
      parameters:
        - { name: days, in: query, schema: { type: integer, enum: [7, 30, 90], default: 30 } }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "403": { $ref: "#/components/responses/Error" }
  /admin/users:
    get:
      tags: [Admin]
      summary: Users (paginated, 20 per page)
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 80 } }
        - { name: role, in: query, schema: { $ref: "#/components/schemas/Role" } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "403": { $ref: "#/components/responses/Error" }
  /admin/users/{user}/role:
    patch:
      tags: [Admin]
      summary: Change a user's role (logged; not your own)
      parameters:
        - { name: user, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { $ref: "#/components/schemas/Role" }
      responses:
        "200": { $ref: "#/components/responses/User" }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Invalid" }
  /admin/stations:
    get:
      tags: [Admin]
      summary: Every station
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 80 } }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/StationStatus" } }
      responses:
        "200": { $ref: "#/components/responses/StationList" }
        "403": { $ref: "#/components/responses/Error" }
  /admin/stations/{station}/status:
    patch:
      tags: [Admin]
      summary: Pause or hide a station (logged; locks the status against operator changes)
      parameters: [{ $ref: "#/components/parameters/Station" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: "#/components/schemas/StationStatus" }
      responses:
        "200": { $ref: "#/components/responses/Station" }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Invalid" }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: Token from `POST /login`

  parameters:
    Station: { name: station, in: path, required: true, schema: { type: integer } }
    Charger: { name: charger, in: path, required: true, schema: { type: integer } }
    Booking: { name: booking, in: path, required: true, schema: { type: integer } }
    Provider: { name: provider, in: path, required: true, schema: { type: string, enum: [google, facebook] } }

  requestBodies:
    EmailOnly:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [email]
            properties:
              email: { type: string, format: email }
    EmailOtp:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [email, otp]
            properties:
              email: { type: string, format: email }
              otp: { type: string, minLength: 6, maxLength: 6 }
    Station:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              name: { type: string, maxLength: 120 }
              description: { type: string, maxLength: 2000 }
              address: { type: string, maxLength: 255 }
              city: { type: string, maxLength: 80 }
              latitude: { type: number }
              longitude: { type: number }
              timezone: { type: string, example: Asia/Kathmandu }
              is_24_hours: { type: boolean }
              opens_at: { type: string, example: "07:00" }
              closes_at: { type: string, example: "22:00" }
              amenities: { type: array, maxItems: 12, items: { type: string, maxLength: 40 } }
              status: { $ref: "#/components/schemas/StationStatus" }
    Charger:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              label: { type: string, maxLength: 20 }
              connector_type: { $ref: "#/components/schemas/Connector" }
              power_kw: { type: number, minimum: 3, maximum: 400 }
              price_per_kwh: { type: number, minimum: 0, maximum: 1000 }
              status: { type: string, enum: [available, offline, maintenance] }

  schemas:
    Connector: { type: string, enum: [CCS2, CHAdeMO, Type2, GBT] }
    StationStatus: { type: string, enum: [active, maintenance, inactive] }
    BookingStatus: { type: string, enum: [confirmed, active, completed, cancelled, no_show] }
    Role: { type: string, enum: [driver, operator, admin] }
    Meta:
      type: object
      properties:
        current_page: { type: integer }
        last_page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }
    Error:
      type: object
      required: [success, message, code, errors]
      properties:
        success: { type: boolean, const: false }
        message: { type: string }
        code: { type: string, example: slot_taken }
        errors: { type: object, additionalProperties: true }
    User:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string }
        phone: { type: [string, "null"] }
        role: { $ref: "#/components/schemas/Role" }
        email_verified: { type: boolean }
        created_at: { type: string, format: date-time }
    Charger:
      type: object
      properties:
        id: { type: integer }
        label: { type: string }
        connector_type: { $ref: "#/components/schemas/Connector" }
        power_kw: { type: number }
        price_per_kwh: { type: number }
        status: { type: string, enum: [available, offline, maintenance] }
        live_status: { type: string, enum: [available, occupied, reserved, offline] }
    Station:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        address: { type: [string, "null"] }
        city: { type: [string, "null"] }
        latitude: { type: number }
        longitude: { type: number }
        timezone: { type: string }
        is_24_hours: { type: boolean }
        opens_at: { type: [string, "null"] }
        closes_at: { type: [string, "null"] }
        status: { $ref: "#/components/schemas/StationStatus" }
        distance_km: { type: number }
        chargers: { type: array, items: { $ref: "#/components/schemas/Charger" } }
    Session:
      type: object
      properties:
        id: { type: integer }
        booking_id: { type: [integer, "null"] }
        status: { type: string, enum: [active, completed] }
        started_at: { type: string, format: date-time }
        ended_at: { type: [string, "null"], format: date-time }
        energy_kwh: { type: number }
        cost: { type: number }
    Booking:
      type: object
      properties:
        id: { type: integer }
        reference: { type: string, example: EV-AB12CD34 }
        status: { $ref: "#/components/schemas/BookingStatus" }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        duration_minutes: { type: integer }
        vehicle: { type: [string, "null"] }
        estimated_kwh: { type: number }
        estimated_cost: { type: number }
        cancelled_at: { type: [string, "null"], format: date-time }
        cancellation_fee: { type: number }
        paid: { type: boolean }
        charger: { $ref: "#/components/schemas/Charger" }
        session: { oneOf: [{ $ref: "#/components/schemas/Session" }, { type: "null" }] }

  responses:
    Ok:
      description: Success
      content:
        application/json:
          schema:
            type: object
            properties:
              success: { type: boolean, const: true }
              message: { type: string }
              data: {}
    Config:
      description: Public settings
      content:
        application/json:
          schema:
            type: object
            properties:
              success: { type: boolean }
              message: { type: string }
              data:
                type: object
                properties:
                  payments_enabled: { type: boolean }
                  payments_provider: { type: [string, "null"] }
                  currency: { type: string }
                  cancellation_free_minutes: { type: integer }
                  cancellation_fee_percent: { type: number }
    AuthToken:
      description: Signed in
      content:
        application/json:
          schema:
            type: object
            properties:
              success: { type: boolean }
              message: { type: string }
              data:
                type: object
                properties:
                  token: { type: string }
                  user: { $ref: "#/components/schemas/User" }
    User:
      description: A user
      content:
        application/json:
          schema:
            type: object
            properties:
              success: { type: boolean }
              message: { type: string }
              data: { $ref: "#/components/schemas/User" }
    Station:
      description: A station
      content:
        application/json:
          schema:
            type: object
            properties:
              success: { type: boolean }
              message: { type: string }
              data: { $ref: "#/components/schemas/Station" }
    StationList:
      description: Stations
      content:
        application/json:
          schema:
            type: object
            properties:
              success: { type: boolean }
              message: { type: string }
              data: { type: array, items: { $ref: "#/components/schemas/Station" } }
    Booking:
      description: A booking
      content:
        application/json:
          schema:
            type: object
            properties:
              success: { type: boolean }
              message: { type: string }
              data: { $ref: "#/components/schemas/Booking" }
    BookingList:
      description: Bookings (`meta` is present only when `page` was requested)
      content:
        application/json:
          schema:
            type: object
            properties:
              success: { type: boolean }
              message: { type: string }
              data: { type: array, items: { $ref: "#/components/schemas/Booking" } }
              meta: { $ref: "#/components/schemas/Meta" }
    Session:
      description: A charging session
      content:
        application/json:
          schema:
            type: object
            properties:
              success: { type: boolean }
              message: { type: string }
              data: { $ref: "#/components/schemas/Session" }
    SessionList:
      description: Sessions (`meta` is present only when `page` was requested)
      content:
        application/json:
          schema:
            type: object
            properties:
              success: { type: boolean }
              message: { type: string }
              data: { type: array, items: { $ref: "#/components/schemas/Session" } }
              meta: { $ref: "#/components/schemas/Meta" }
    PaymentStarted:
      description: Where to send the driver
      content:
        application/json:
          schema:
            type: object
            properties:
              success: { type: boolean }
              message: { type: string }
              data:
                type: object
                properties:
                  payment_id: { type: integer }
                  provider: { type: string, enum: [khalti, esewa] }
                  redirect_url: { type: string }
                  form: { type: [object, "null"], additionalProperties: { type: string } }
    PaymentResult:
      description: Payment outcome
      content:
        application/json:
          schema:
            type: object
            properties:
              success: { type: boolean }
              message: { type: string }
              data:
                type: object
                properties:
                  id: { type: integer }
                  status: { type: string, enum: [initiated, completed, failed, refunded, refund_pending] }
                  booking_id: { type: integer }
    Error:
      description: Request failed
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Invalid:
      description: Validation failed (`errors` maps field names to messages)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooMany:
      description: Rate limit exceeded (`code` is `too_many_requests`; see `Retry-After`)
      headers:
        Retry-After: { schema: { type: integer } }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
