# PRODUCTION stack. Put a TLS-terminating reverse proxy (Caddy, Traefik, nginx, a cloud load balancer)
# in front of ports 8000 (API) and 3000 (web). See DEPLOYMENT.md.
#
#   cp .env.prod.example .env.prod   # fill it in
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
x-api-env: &api-env
  APP_ENV: production
  APP_DEBUG: "false"
  APP_KEY: ${APP_KEY:?set APP_KEY in .env.prod}
  APP_NAME: ${APP_NAME:-Bijuli Charge API}
  TRUSTED_PROXIES: ${TRUSTED_PROXIES:-*}
  APP_URL: ${API_URL:?set API_URL in .env.prod}
  FRONTEND_URL: ${WEB_URL:?set WEB_URL in .env.prod}
  CORS_ALLOWED_ORIGINS: ${WEB_URL}
  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: 3306
  DB_DATABASE: ${DB_DATABASE:-ev_charge}
  DB_USERNAME: ${DB_USERNAME:-ev}
  DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env.prod}
  CACHE_STORE: database
  SESSION_DRIVER: database
  QUEUE_CONNECTION: database
  LOG_CHANNEL: stderr
  LOG_LEVEL: warning
  LOG_SLACK_WEBHOOK_URL: ${LOG_SLACK_WEBHOOK_URL:-}
  EXPOSE_OTP_IN_RESPONSE: "false"
  MAIL_MAILER: ${MAIL_MAILER:-smtp}
  MAIL_HOST: ${MAIL_HOST:-}
  MAIL_PORT: ${MAIL_PORT:-587}
  MAIL_USERNAME: ${MAIL_USERNAME:-}
  MAIL_PASSWORD: ${MAIL_PASSWORD:-}
  MAIL_ENCRYPTION: ${MAIL_ENCRYPTION:-tls}
  MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-no-reply@example.com}
  SANCTUM_TOKEN_EXPIRATION_MINUTES: ${SANCTUM_TOKEN_EXPIRATION_MINUTES:-10080}
  PAYMENTS_DRIVER: ${PAYMENTS_DRIVER:-none}
  KHALTI_SECRET_KEY: ${KHALTI_SECRET_KEY:-}
  KHALTI_BASE_URL: ${KHALTI_BASE_URL:-https://dev.khalti.com/api/v2}
  ESEWA_SECRET_KEY: ${ESEWA_SECRET_KEY:-}
  ESEWA_FORM_URL: ${ESEWA_FORM_URL:-https://rc-epay.esewa.com.np/api/epay/main/v2/form}
  ESEWA_STATUS_URL: ${ESEWA_STATUS_URL:-https://rc.esewa.com.np/api/epay/transaction/status/}
  ESEWA_PRODUCT_CODE: ${ESEWA_PRODUCT_CODE:-EPAYTEST}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  GOOGLE_REDIRECT_URI: ${API_URL}/api/auth/google/callback
  FACEBOOK_CLIENT_ID: ${FACEBOOK_CLIENT_ID:-}
  FACEBOOK_CLIENT_SECRET: ${FACEBOOK_CLIENT_SECRET:-}
  FACEBOOK_REDIRECT_URI: ${API_URL}/api/auth/facebook/callback

x-api-build: &api-build
  context: ./backend
  target: app

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-ev_charge}
      MYSQL_USER: ${DB_USERNAME:-ev}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env.prod}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env.prod}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 20

  api:
    build: *api-build
    restart: unless-stopped
    environment:
      <<: *api-env
      RUN_MIGRATIONS: "true"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "SCRIPT_NAME=/ping SCRIPT_FILENAME=/ping REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000 | grep -q pong"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  # Sends queued email (booking confirmations, reminders, OTP codes).
  queue:
    build: *api-build
    restart: unless-stopped
    environment: *api-env
    command: ["php", "artisan", "queue:work", "--tries=3", "--max-time=3600"]
    depends_on:
      api:
        condition: service_healthy

  # Every-minute housekeeping: no-shows, overrunning sessions, reminders, pruning.
  scheduler:
    build: *api-build
    restart: unless-stopped
    environment: *api-env
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      api:
        condition: service_healthy

  nginx:
    build:
      context: ./backend
      target: web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8080" # reachable from the host (your TLS proxy) only
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/up >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${API_URL:?set API_URL in .env.prod}
        NEXT_PUBLIC_SITE_URL: ${WEB_URL:?set WEB_URL in .env.prod}
        NEXT_PUBLIC_TILE_URL: ${TILE_URL:-}
        NEXT_PUBLIC_TILE_ATTRIBUTION: ${TILE_ATTRIBUTION:-}
        NEXT_PUBLIC_DEMO_LOGIN: "false"
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000" # reachable from the host (your TLS proxy) only

volumes:
  mysql-data:
